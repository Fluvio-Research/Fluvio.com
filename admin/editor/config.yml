# Fluvio content admin configuration (Sveltia CMS, Decap-compatible).
#
# Run locally with `npm run cms` and choose "Work with Local Repository".
# The same config works against GitHub later if the admin is ever hosted:
# the backend below is only used for that remote mode.

backend:
  name: github
  repo: Fluvio-Research/Fluvio.com
  branch: main

site_url: https://fluvio-research.github.io/Fluvio.com/
display_url: https://fluvio-research.github.io/Fluvio.com/

media_folder: src/assets/images/fluvio
public_folder: '/src/assets/images/fluvio'

editor:
  preview: false

i18n:
  structure: single_file
  locales: [en, fr, es]
  default_locale: en

collections:
  - name: projects
    label: Projects
    label_singular: Project
    description: >-
      The project case studies shown on the Projects page and the homepage.
      Each project has English, French and Spanish tabs; fill in all three.
      Fields marked as shared apply to every language automatically.
    folder: src/data/fluvio/content/projects
    format: json
    extension: json
    create: true
    delete: false
    identifier_field: title
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    i18n: true
    fields:
      - {
          name: order,
          label: Display order,
          widget: number,
          value_type: int,
          i18n: duplicate,
          hint: 'Position on the page; 1 comes first.',
        }
      - {
          name: slug,
          label: 'URL slug (never change after publishing)',
          widget: string,
          pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'],
          i18n: duplicate,
        }
      - { name: title, label: Title, widget: string, i18n: true }
      - {
          name: summary,
          label: Summary,
          widget: text,
          i18n: true,
          hint: 'One or two sentences shown in project lists.',
        }
      - {
          name: location,
          label: Location,
          widget: string,
          required: false,
          i18n: true,
          hint: 'For example: Honiara, Solomon Islands.',
        }
      - {
          name: timeframe,
          label: Timeframe,
          widget: string,
          required: false,
          i18n: true,
          hint: 'For example: 2024 - Current.',
        }
      - {
          name: disciplines,
          label: Disciplines,
          widget: list,
          i18n: true,
          field: { name: discipline, label: Discipline, widget: string },
        }
      - {
          name: partners,
          label: Partners,
          widget: list,
          required: false,
          i18n: duplicate,
          field: { name: partner, label: Partner, widget: string },
        }
      - { name: heroImage, label: Main photo, widget: image, i18n: duplicate }
      - {
          name: heroAlt,
          label: 'Main photo description (for accessibility)',
          widget: string,
          i18n: true,
          hint: 'Describe what the photo shows, for screen readers.',
        }
      - {
          name: gallery,
          label: Gallery,
          widget: list,
          required: false,
          i18n: duplicate,
          fields:
            [
              { name: src, label: Image, widget: image },
              { name: alt, label: Image description, widget: string },
              { name: caption, label: Caption, widget: string, required: false },
            ],
        }
      - {
          name: challenge,
          label: 'Story: challenge',
          widget: list,
          i18n: true,
          field: { name: paragraph, label: Paragraph, widget: text },
        }
      - {
          name: approach,
          label: 'Story: approach',
          widget: list,
          i18n: true,
          field: { name: paragraph, label: Paragraph, widget: text },
        }
      - {
          name: outcome,
          label: 'Story: outcome',
          widget: list,
          i18n: true,
          field: { name: paragraph, label: Paragraph, widget: text },
        }
      - {
          name: featured,
          label: 'Featured on the homepage',
          widget: boolean,
          required: false,
          i18n: duplicate,
          hint: 'Turn on to show this project in the homepage selection.',
        }
      - {
          name: relatedProjects,
          label: 'Related project slugs',
          widget: list,
          required: false,
          i18n: duplicate,
          hint: 'The URL slugs of other projects to cross-link, e.g. tina or bina.',
          field: { name: slug, label: Project slug, widget: string },
        }

  - name: team
    label: Team
    label_singular: Team member
    description: >-
      The people on the Team page. Photos should be roughly square. Roles,
      biographies and specialties need all three language tabs filled in.
    folder: src/data/fluvio/content/team
    format: json
    extension: json
    create: true
    delete: false
    identifier_field: name
    summary: '{{name}}'
    sortable_fields: [order, name]
    i18n: true
    fields:
      - {
          name: order,
          label: Display order,
          widget: number,
          value_type: int,
          i18n: duplicate,
          hint: 'Position on the page; 1 comes first.',
        }
      - { name: name, label: Name, widget: string, i18n: duplicate }
      - { name: role, label: Role, widget: string, required: false, i18n: true }
      - { name: bio, label: Biography, widget: text, i18n: true }
      - { name: portrait, label: Portrait, widget: image, i18n: duplicate }
      - { name: portraitAlt, label: 'Portrait description', widget: string, i18n: duplicate }
      - {
          name: specialties,
          label: Specialties,
          widget: list,
          i18n: true,
          field: { name: specialty, label: Specialty, widget: string },
        }
      - { name: profileUrl, label: 'Profile link', widget: string, required: false, i18n: duplicate }

  - name: expertise
    label: Expertise
    label_singular: Expertise area
    description: >-
      The six capability areas on the Expertise page. The first four also
      appear on the homepage, in display order.
    folder: src/data/fluvio/content/expertise
    format: json
    extension: json
    create: true
    delete: false
    identifier_field: title
    slug: '{{fields.slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    i18n: true
    fields:
      - {
          name: order,
          label: Display order,
          widget: number,
          value_type: int,
          i18n: duplicate,
          hint: 'Position on the page; 1 comes first.',
        }
      - {
          name: slug,
          label: 'URL anchor (never change after publishing)',
          widget: string,
          pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'],
          i18n: duplicate,
        }
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: summary, label: Summary, widget: text, i18n: true }
      - {
          name: description,
          label: Description,
          widget: list,
          i18n: true,
          field: { name: paragraph, label: Paragraph, widget: text },
        }
      - { name: image, label: Photo, widget: image, i18n: duplicate }
      - { name: imageAlt, label: 'Photo description', widget: string, i18n: true }
      - {
          name: relatedProjects,
          label: 'Related project slugs',
          widget: list,
          i18n: duplicate,
          field: { name: slug, label: Project slug, widget: string },
        }

  - name: site
    label: 'Site settings'
    description: 'Company-wide text: the vision statement, values, and the words in the header and footer.'
    i18n: true
    files:
      - name: content
        label: 'Site content'
        file: src/data/fluvio/content/site/content.json
        format: json
        i18n: true
        fields:
          - { name: name, label: 'Company name', widget: string, i18n: duplicate }
          - { name: tagline, label: Tagline, widget: string, i18n: true }
          - { name: summary, label: 'Company summary', widget: text, i18n: true }
          - { name: heroImage, label: 'Default social image', widget: image, i18n: duplicate }
          - { name: heroAlt, label: 'Default image description', widget: string, i18n: true }
          - name: vision
            label: Vision
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: description, label: Statement, widget: text, i18n: true }
              - { name: image, label: Photo, widget: image, i18n: duplicate }
              - { name: imageAlt, label: 'Photo description', widget: string, i18n: true }
          - name: values
            label: 'Company values (exactly five)'
            widget: list
            i18n: true
            min: 5
            max: 5
            fields:
              - { name: title, label: Value, widget: string, i18n: true }
              - { name: description, label: Description, widget: text, i18n: true }
      - name: homepage
        label: 'Homepage'
        file: src/data/fluvio/content/site/homepage.json
        format: json
        i18n: true
        fields:
          - name: slides
            label: 'Hero slider (top of the homepage)'
            label_singular: Slide
            widget: list
            min: 1
            max: 8
            i18n: true
            fields:
              - { name: eyebrow, label: 'Small label above the headline', widget: string, i18n: true }
              - { name: title, label: Headline, widget: string, i18n: true }
              - { name: description, label: 'Supporting line', widget: text, i18n: true }
              - { name: action, label: 'Button text', widget: string, i18n: true }
              - name: href
                label: 'Button goes to'
                widget: select
                i18n: duplicate
                options:
                  - { label: 'Vision page', value: '/vision' }
                  - { label: 'Expertise page', value: '/expertise' }
                  - { label: 'Projects page', value: '/projects' }
                  - { label: 'Projects page, platforms section', value: '/projects#platforms-heading' }
                  - { label: 'Team page', value: '/team' }
                  - { label: 'Contact page', value: '/contact' }
              - { name: image, label: Photo, widget: image, i18n: duplicate }
              - { name: imageAlt, label: 'Photo description', widget: string, i18n: true }
          - { name: metaDescription, label: 'Search engine description', widget: text, i18n: true }
          - name: capabilities
            label: 'Capability strip (three columns under the slider)'
            widget: list
            min: 3
            max: 3
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: description, label: Description, widget: text, i18n: true }
          - {
              name: capabilitiesLabel,
              label: 'Capability strip label (for screen readers)',
              widget: string,
              i18n: true,
            }
          - { name: expertiseEyebrow, label: 'Expertise section: small label', widget: string, i18n: true }
          - { name: expertiseTitle, label: 'Expertise section: heading', widget: string, i18n: true }
          - { name: expertiseIntro, label: 'Expertise section: intro', widget: text, i18n: true }
          - { name: expertiseMore, label: 'Expertise section: link text', widget: string, i18n: true }
          - { name: projectsTitle, label: 'Projects section: heading', widget: string, i18n: true }
          - { name: projectsIntro, label: 'Projects section: intro', widget: text, i18n: true }
          - { name: projectsFeatured, label: 'Projects section: featured tag', widget: string, i18n: true }
          - { name: projectsMore, label: 'Projects section: link text', widget: string, i18n: true }
          - { name: platformsTitle, label: 'Platforms section: heading', widget: string, i18n: true }
          - { name: platformsIntro, label: 'Platforms section: intro', widget: text, i18n: true }
          - name: platforms
            label: 'Platform descriptions (also shown on the Projects page)'
            widget: object
            i18n: true
            fields:
              - { name: label, label: 'Small label', widget: string, i18n: true }
              - name: sense
                label: FluvioSense
                widget: object
                i18n: true
                fields:
                  - { name: title, label: Name, widget: string, i18n: duplicate }
                  - { name: description, label: Description, widget: text, i18n: true }
                  - { name: action, label: 'Link text', widget: string, i18n: true }
                  - { name: href, label: 'Platform link', widget: string, i18n: duplicate }
                  - { name: image, label: Screenshot, widget: image, i18n: duplicate }
                  - { name: imageAlt, label: 'Screenshot description (for screen readers)', widget: text, i18n: true }
                  - {
                      name: imageHref,
                      label: 'Screenshot link (live deployment; leave empty to reuse the platform link)',
                      widget: string,
                      i18n: duplicate,
                      required: false,
                    }
              - name: cascade
                label: FluvioCascade
                widget: object
                i18n: true
                fields:
                  - { name: title, label: Name, widget: string, i18n: duplicate }
                  - { name: description, label: Description, widget: text, i18n: true }
                  - { name: action, label: 'Link text', widget: string, i18n: true }
                  - { name: href, label: 'Platform link', widget: string, i18n: duplicate }
                  - { name: image, label: Screenshot, widget: image, i18n: duplicate }
                  - { name: imageAlt, label: 'Screenshot description (for screen readers)', widget: text, i18n: true }
                  - {
                      name: imageHref,
                      label: 'Screenshot link (live deployment; leave empty to reuse the platform link)',
                      widget: string,
                      i18n: duplicate,
                      required: false,
                    }
              - name: reef
                label: FluvioReef
                widget: object
                i18n: true
                fields:
                  - { name: title, label: Name, widget: string, i18n: duplicate }
                  - { name: description, label: Description, widget: text, i18n: true }
                  - { name: action, label: 'Link text', widget: string, i18n: true }
                  - { name: href, label: 'Platform link', widget: string, i18n: duplicate }
                  - { name: image, label: Screenshot, widget: image, i18n: duplicate }
                  - { name: imageAlt, label: 'Screenshot description (for screen readers)', widget: text, i18n: true }
                  - {
                      name: imageHref,
                      label: 'Screenshot link (live deployment; leave empty to reuse the platform link)',
                      widget: string,
                      i18n: duplicate,
                      required: false,
                    }
          - { name: teamTitle, label: 'Team section: heading', widget: string, i18n: true }
          - { name: teamIntro, label: 'Team section: intro', widget: text, i18n: true }
          - { name: teamMore, label: 'Team section: link text', widget: string, i18n: true }
          - { name: impactTitle, label: 'Impact section (navy band): heading', widget: string, i18n: true }
          - name: impactBody
            label: 'Impact section: paragraphs'
            widget: list
            i18n: true
            field: { name: paragraph, label: Paragraph, widget: text }
      - name: pages
        label: 'Page text'
        file: src/data/fluvio/content/site/pages.json
        format: json
        i18n: true
        fields:
        - name: visionPage
          label: 'Vision page'
          widget: object
          i18n: true
          fields:
            - { name: metaTitle, label: 'Browser tab title', widget: string, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Page heading', widget: string, i18n: true }
            - { name: lede, label: 'Intro line', widget: text, i18n: true }
            - { name: statementTitle, label: 'Statement heading', widget: string, i18n: true }
            - { name: valuesTitle, label: 'Values heading', widget: string, i18n: true }
            - { name: valuesIntro, label: 'Values intro', widget: text, i18n: true }
            - { name: practiceTitle, label: 'Practice heading', widget: string, i18n: true }
            - { name: practiceImageAlt, label: 'Practice photo description', widget: string, i18n: true }
            - { name: contactEyebrow, label: 'Contact card: small label', widget: string, i18n: true }
            - { name: contactTitle, label: 'Contact card: heading', widget: string, i18n: true }
            - { name: contactIntro, label: 'Contact card: intro', widget: text, i18n: true }
            - name: practiceBody
              label: 'Practice paragraphs'
              widget: list
              i18n: true
              field: { name: paragraph, label: Paragraph, widget: text }
        - name: expertisePage
          label: 'Expertise page'
          widget: object
          i18n: true
          fields:
            - { name: metaTitle, label: 'Browser tab title', widget: string, i18n: true }
            - { name: metaDescription, label: 'Search engine description', widget: text, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Page heading', widget: string, i18n: true }
            - { name: lede, label: 'Intro line', widget: text, i18n: true }
            - { name: introTitle, label: 'Section heading', widget: string, i18n: true }
            - { name: introIntro, label: 'Section intro', widget: text, i18n: true }
            - { name: areasLabel, label: 'Areas label (screen readers)', widget: string, i18n: true }
            - { name: relatedProjects, label: 'Related projects label', widget: string, i18n: true }
            - { name: teamTitle, label: 'Team band heading', widget: string, i18n: true }
            - { name: teamBody, label: 'Team band text', widget: text, i18n: true }
            - { name: teamLink, label: 'Team band link', widget: string, i18n: true }
        - name: teamPage
          label: 'Team page'
          widget: object
          i18n: true
          fields:
            - { name: metaTitle, label: 'Browser tab title', widget: string, i18n: true }
            - { name: metaDescription, label: 'Search engine description', widget: text, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Page heading', widget: string, i18n: true }
            - { name: lede, label: 'Intro line', widget: text, i18n: true }
            - { name: heroImageAlt, label: 'Top photo description', widget: string, i18n: true }
            - { name: directoryTitle, label: 'Directory heading', widget: string, i18n: true }
            - { name: directoryIntro, label: 'Directory intro', widget: text, i18n: true }
            - { name: contactTitle, label: 'Contact card: heading', widget: string, i18n: true }
            - { name: contactIntro, label: 'Contact card: intro', widget: text, i18n: true }
            - { name: viewProfile, label: 'Profile link text', widget: string, i18n: true }
        - name: contactPage
          label: 'Contact page'
          widget: object
          i18n: true
          fields:
            - { name: metaTitle, label: 'Browser tab title', widget: string, i18n: true }
            - { name: metaDescription, label: 'Search engine description', widget: text, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Page heading', widget: string, i18n: true }
            - { name: lede, label: 'Intro line', widget: text, i18n: true }
            - { name: heroImageAlt, label: 'Photo description', widget: string, i18n: true }
            - { name: enquiryTitle, label: 'Enquiry heading', widget: string, i18n: true }
            - { name: enquiryBody, label: 'Enquiry text', widget: text, i18n: true }
            - { name: enquiryAction, label: 'Enquiry link text', widget: string, i18n: true }
            - { name: enquirySubject, label: 'Email draft subject', widget: string, i18n: true }
            - { name: enquiryTemplate, label: 'Email draft template', widget: text, i18n: true }
            - { name: enquiryNote, label: 'Small print under the link', widget: text, i18n: true }
            - { name: socialTitle, label: 'Follow heading', widget: string, i18n: true }
            - { name: socialBody, label: 'Follow text', widget: text, i18n: true }
            - { name: socialAction, label: 'Follow link text', widget: string, i18n: true }
        - name: projectsPage
          label: 'Projects page'
          widget: object
          i18n: true
          fields:
            - { name: metaTitle, label: 'Browser tab title', widget: string, i18n: true }
            - { name: metaDescription, label: 'Search engine description', widget: text, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Page heading', widget: string, i18n: true }
            - { name: lede, label: 'Intro line', widget: text, i18n: true }
            - { name: featuredLabel, label: 'Featured label (screen readers)', widget: string, i18n: true }
            - { name: listEyebrow, label: 'List: small label', widget: string, i18n: true }
            - { name: listTitle, label: 'List: heading', widget: string, i18n: true }
            - { name: listIntro, label: 'List: intro', widget: text, i18n: true }
            - { name: allProjects, label: 'Hidden list heading (screen readers)', widget: string, i18n: true }
            - { name: platformsEyebrow, label: 'Platforms: small label', widget: string, i18n: true }
            - { name: platformsTitle, label: 'Platforms: heading', widget: string, i18n: true }
            - { name: platformsIntro, label: 'Platforms: intro', widget: text, i18n: true }
        - name: projectDetail
          label: 'Project pages (shared labels)'
          widget: object
          i18n: true
          fields:
            - { name: back, label: 'Back link', widget: string, i18n: true }
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: challenge, label: 'Story heading 1', widget: string, i18n: true }
            - { name: approach, label: 'Story heading 2', widget: string, i18n: true }
            - { name: outcome, label: 'Story heading 3', widget: string, i18n: true }
            - { name: storyLabel, label: 'Story label (screen readers)', widget: string, i18n: true }
            - { name: galleryLabel, label: 'Gallery label (screen readers)', widget: string, i18n: true }
            - { name: imageLabel, label: 'Image label (screen readers)', widget: string, i18n: true }
            - { name: relatedExpertiseEyebrow, label: 'Related expertise: small label', widget: string, i18n: true }
            - { name: relatedExpertiseTitle, label: 'Related expertise: heading', widget: string, i18n: true }
            - { name: relatedProjectsEyebrow, label: 'Related projects: small label', widget: string, i18n: true }
            - { name: relatedProjectsTitle, label: 'Related projects: heading', widget: string, i18n: true }
            - { name: contactEyebrow, label: 'Contact card: small label', widget: string, i18n: true }
            - { name: contactTitle, label: 'Contact card: heading', widget: string, i18n: true }
            - { name: contactIntro, label: 'Contact card: intro', widget: text, i18n: true }
        - name: project
          label: 'Project cards (buttons and labels)'
          widget: object
          i18n: true
          fields:
            - { name: viewProject, label: 'View project button', widget: string, i18n: true }
            - { name: readProject, label: 'Read project button', widget: string, i18n: true }
            - { name: featuredEyebrow, label: 'Featured tag', widget: string, i18n: true }
            - { name: location, label: 'Location label', widget: string, i18n: true }
            - { name: timeframe, label: 'Timeframe label', widget: string, i18n: true }
            - { name: disciplines, label: 'Disciplines label', widget: string, i18n: true }
            - { name: partners, label: 'Partners label', widget: string, i18n: true }
        - name: contactPanel
          label: 'Contact card (default text)'
          widget: object
          i18n: true
          fields:
            - { name: eyebrow, label: 'Small label', widget: string, i18n: true }
            - { name: title, label: 'Heading', widget: string, i18n: true }
            - { name: intro, label: 'Intro', widget: text, i18n: true }
            - { name: action, label: 'Button text', widget: string, i18n: true }
        - name: slider
          label: 'Slider controls (accessibility text)'
          widget: object
          i18n: true
          fields:
            - { name: regionLabel, label: 'Slider label', widget: string, i18n: true }
            - { name: slideOf, label: 'Word between numbers (1 of 5)', widget: string, i18n: true }
            - { name: previous, label: 'Previous button label', widget: string, i18n: true }
            - { name: next, label: 'Next button label', widget: string, i18n: true }
            - { name: pause, label: 'Pause button', widget: string, i18n: true }
            - { name: resume, label: 'Resume button', widget: string, i18n: true }
            - { name: pauseAria, label: 'Pause description', widget: string, i18n: true }
            - { name: resumeAria, label: 'Resume description', widget: string, i18n: true }
            - { name: autoplayOff, label: 'Autoplay off text', widget: string, i18n: true }
            - { name: autoplayOffAria, label: 'Autoplay off description', widget: string, i18n: true }
            - { name: statusTemplate, label: 'Announcement template', widget: string, i18n: true }
      - name: navigation
        label: 'Header and footer'
        file: src/data/fluvio/content/site/navigation.json
        format: json
        i18n: true
        fields:
          - { name: vision, label: 'Menu: Vision', widget: string, i18n: true }
          - { name: expertise, label: 'Menu: Expertise', widget: string, i18n: true }
          - { name: projects, label: 'Menu: Projects', widget: string, i18n: true }
          - { name: team, label: 'Menu: Team', widget: string, i18n: true }
          - { name: contact, label: 'Menu: Contact', widget: string, i18n: true }
