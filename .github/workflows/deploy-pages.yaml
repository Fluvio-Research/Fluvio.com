name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository stays configured for the production domain. Only this
      # preview build is repointed at the GitHub Pages origin and base path.
      - name: Point the build at GitHub Pages
        run: |
          sed -i "s|site: 'https://fluvio.com.au'|site: 'https://fluvio-research.github.io'|" src/config.yaml
          sed -i "s|base: '/'|base: '/Fluvio.com'|" src/config.yaml

      - name: Build site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
